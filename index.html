    <style>
      html, body { cursor: none; margin: 0; height: 100%; overflow: hidden; background: #1c130d; }
      canvas#atlas { cursor: none; position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      /* The only on-screen text allowed: a plain fading hint. No panels, no buttons. */
      #hint {
        position: fixed; left: 0; right: 0; bottom: 4.5vh; text-align: center;
        font: 400 14px/1 'Jua', 'BM JUA_TTF', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; letter-spacing: 0.06em;
        color: rgba(255, 240, 214, 0.78); text-shadow: 0 1px 6px rgba(20, 10, 0, 0.55);
        pointer-events: none; user-select: none; opacity: 0; transition: opacity 1.4s ease;
      }
      #hint.on { opacity: 1; }
    </style>

  <body>
    <canvas id="atlas" tabindex="0"></canvas>
